<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무료 온라인 이미지 변환 & 용량 압축기 | FastImgConvert</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur py-4 px-6">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
        FastImgConvert
      </h1>
      <span class="text-xs text-slate-400 bg-slate-800 px-3 py-1 rounded-full">100% 무료 / 서버 전송 없음</span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-12 w-full flex-grow">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-white sm:text-4xl">이미지 포맷 변환 & 용량 압축</h2>
      <p class="mt-3 text-slate-400">PNG, JPG, WEBP 파일을 서버 업로드 없이 브라우저에서 즉시 변환하세요.</p>
    </div>

    <div class="bg-slate-800/50 border-2 border-dashed border-slate-700 hover:border-blue-500 transition-colors rounded-2xl p-8 text-center cursor-pointer shadow-xl mb-8" id="drop-zone">
      <input type="file" id="file-input" accept="image/*" class="hidden">
      <div class="flex flex-col items-center justify-center space-y-3">
        <svg class="w-12 h-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <p class="text-base text-slate-200 font-medium">이미지 파일을 이곳에 드래그하거나 클릭하여 선택하세요</p>
        <p class="text-xs text-slate-400">지원 형식: JPG, PNG, WEBP</p>
      </div>
    </div>

    <div id="controls" class="hidden bg-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
      <div class="flex items-center space-x-4">
        <img id="preview-img" class="w-20 h-20 object-cover rounded-lg border border-slate-700" src="" alt="미리보기">
        <div class="overflow-hidden">
          <p id="file-name" class="font-medium text-white truncate">image.png</p>
          <p id="file-size" class="text-sm text-slate-400">원본 크기: 0 KB</p>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-4 border-t border-slate-700">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">변환할 포맷</label>
          <select id="format-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="image/webp">WEBP (용량 최적화 추천)</option>
            <option value="image/jpeg">JPG / JPEG</option>
            <option value="image/png">PNG</option>
          </select>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-medium text-slate-300">화질 / 압축률</label>
            <span id="quality-val" class="text-xs text-blue-400 font-semibold">80%</span>
          </div>
          <input type="range" id="quality-range" min="0.1" max="1.0" step="0.05" value="0.8" class="w-full accent-blue-500">
        </div>
      </div>

      <button id="convert-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-6 rounded-xl transition-colors shadow-lg shadow-blue-600/30">
        변환 및 이미지 다운로드
      </button>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© 2026 FastImgConvert. All rights reserved. 모든 처리는 사용자의 브라우저 내에서 안전하게 진행됩니다.</p>
  </footer>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const controls = document.getElementById('controls');
    const previewImg = document.getElementById('preview-img');
    const fileName = document.getElementById('file-name');
    const fileSize = document.getElementById('file-size');
    const formatSelect = document.getElementById('format-select');
    const qualityRange = document.getElementById('quality-range');
    const qualityVal = document.getElementById('quality-val');
    const convertBtn = document.getElementById('convert-btn');

    let currentFile = null;

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-blue-500'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-blue-500');
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    qualityRange.addEventListener('input', (e) => {
      qualityVal.textContent = Math.round(e.target.value * 100) + '%';
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) { alert('이미지 파일만 선택해 주세요.'); return; }
      currentFile = file;
      fileName.textContent = file.name;
      fileSize.textContent = `원본 크기: ${(file.size / 1024).toFixed(1)} KB`;

      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        controls.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    convertBtn.addEventListener('click', () => {
      if (!currentFile) return;

      const img = new Image();
      img.src = previewImg.src;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        const mimeType = formatSelect.value;
        const quality = parseFloat(qualityRange.value);

        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          
          const ext = mimeType.split('/')[1];
          const nameWithoutExt = currentFile.name.substring(0, currentFile.name.lastIndexOf('.')) || currentFile.name;
          a.download = `${nameWithoutExt}_converted.${ext}`;
          
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, mimeType, quality);
      };
    });
  </script>
</body>
</html>
